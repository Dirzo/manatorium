<meta charset="utf-8">
<title>Siege of Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@700&display=swap">
<style>/* Layout: one castle arena framed by a top HUD, a left facility rail with a slide-out drawer, and a bottom roster drawer. */
:root {
  --ink: #0f1430;        /* pixel outline */
  --night: #161d3a;      /* page ground */
  --panel: #222c5a;      /* drawers */
  --panel-2: #2c3870;    /* raised cards */
  --line: #42509a;
  --text: #f1efff;
  --muted: #a9b0dc;
  --gold: #ffcf3a;
  --mint: #5ee07a;
  --rose: #ff5d8f;
  --sky: #5fd3ff;
  --violet: #a98aff;
  --f-display: "Fredoka", "Atkinson Hyperlegible", "Segoe UI", sans-serif;
  --f-logo: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--f-body); font-size: 14px; line-height: 1.4; margin: 0; overflow-x: hidden;
  background-image: radial-gradient(circle at 20% 0%, #24306a 0, transparent 50%), radial-gradient(circle at 90% 100%, #2a2056 0, transparent 45%); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; color: var(--muted); }

#app { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 24px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- buttons ---------- */
.btn { border: 2px solid var(--ink); background: var(--panel-2); color: var(--text); padding: 7px 12px; border-radius: 4px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 3px 0 var(--ink);
  font-family: var(--f-display); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: transform .06s; white-space: nowrap; }
.btn:hover { background: #36448a; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 1px 0 var(--ink); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--gold); color: #2a1a00; }
.btn.primary:hover { background: #ffe066; }
.btn.go { background: var(--mint); color: #08250f; }
.btn.danger { background: var(--rose); color: #2a0010; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn .cost { display: inline-flex; align-items: center; gap: 3px; }
.btn img.px { width: 15px; height: 15px; }

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 12px; box-shadow: 0 4px 0 var(--ink); }
.brand { display: flex; flex-direction: column; line-height: 1; margin-right: 6px; }
.brand h1 { font-size: 24px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink), 3px 3px 0 #c2410c; letter-spacing: 0.04em; }
.brand span { font-family: var(--f-display); font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
.siegeinfo { display: flex; flex-direction: column; min-width: 150px; }
.siegeinfo b { font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.siegeinfo small { color: var(--muted); font-size: 12px; }
.siegeinfo small.boss { color: var(--rose); font-family: var(--f-display); letter-spacing: 0.06em; }
.castlebar { display: flex; flex-direction: column; gap: 3px; min-width: 150px; flex: 1 1 150px; max-width: 260px; }
.castlebar .bar { height: 12px; border: 2px solid var(--ink); background: #3a2a4a; border-radius: 2px; overflow: hidden; }
.castlebar .bar i { display: block; height: 100%; background: linear-gradient(#8ff0a4, var(--mint) 50%, #3fb85a); transition: width .2s; }
.castlebar .bar i.low { background: linear-gradient(#ff9ab6, var(--rose) 50%, #d03a6a); }
.castlebar small { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.purse { display: flex; gap: 12px; align-items: center; }
.purse .coinbox { display: flex; align-items: center; gap: 5px; font-family: var(--f-display); font-size: 20px; }
.purse .coinbox img { width: 22px; height: 22px; }
.purse .coinbox.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.25); } }
#gold { color: var(--gold); min-width: 3ch; }
#diamonds { color: var(--sky); }
.controls { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
.speed { display: inline-flex; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
.speed button { border: 0; background: var(--panel-2); padding: 6px 10px; font-family: var(--f-display); }
.speed button[aria-pressed="true"] { background: var(--sky); color: #04202e; }
.hammerbtn { position: relative; overflow: hidden; }
.hammerbtn .cdfill { position: absolute; inset: 0; background: rgba(15,20,48,0.65); transform-origin: left; pointer-events: none; }
.hammerbtn.armed { background: var(--rose); color: #2a0010; animation: pulse .6s infinite alternate; }
@keyframes pulse { to { filter: brightness(1.25); } }
kbd { font-family: var(--f-display); font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; opacity: 0.7; }

/* ---------- stage ---------- */
.stage { display: flex; gap: 10px; align-items: flex-start; }
.rail { flex: 0 0 92px; }
.intel { flex: 1 1 220px; min-width: 220px; max-width: 420px; background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 10px; align-self: stretch; overflow: hidden; }
.intel h3 { font-size: 17px; }
.intel .foe { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.intel .foe img { width: 36px; height: 36px; background: #3a2f5a; border: 2px solid var(--ink); border-radius: 3px; }
.intel .foe b { font-family: var(--f-display); font-weight: 500; font-size: 13px; display: block; }
.intel .foe span { color: var(--muted); }
.intel .foe.boss img { background: #5a1a36; }
.intel .syn p { margin: 0 0 4px; font-size: 12px; }
.intel .syn b { font-family: var(--f-display); font-weight: 500; }
.rail { display: flex; flex-direction: column; gap: 8px; }
.rail button { border: 2px solid var(--ink); border-radius: 6px; background: var(--panel); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 3px 0 var(--ink);
  font-family: var(--f-display); font-size: 12px; line-height: 1.1; text-align: center; }
.rail button img { width: 40px; height: 40px; }
.rail button:hover { background: var(--panel-2); }
.rail button[aria-pressed="true"] { background: var(--gold); color: #2a1a00; }
.rail button[disabled] { opacity: 0.5; }
.rail .hint { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; }
.arena-wrap { flex: 0 1 auto; width: min(100%, max(560px, calc((100vh - 300px) * 16 / 9))); min-width: 0; position: relative; border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; box-shadow: 0 5px 0 var(--ink); background: #74d35a; }
#arena { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; }
#arena.armed { cursor: crosshair; }
.arena-tag { position: absolute; top: 8px; font-family: var(--f-display); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); pointer-events: none; }
.arena-tag.l { left: 22%; } .arena-tag.r { right: 10px; }
#prepHint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(15,20,48,0.82); border: 2px solid var(--ink); border-radius: 4px; padding: 5px 10px; font-size: 12px; pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }

/* left drawer */
.drawer { position: absolute; left: 0; top: 0; bottom: 0; width: min(400px, 86%); background: var(--panel); border-right: 3px solid var(--ink); box-shadow: 6px 0 0 rgba(15,20,48,0.4);
  transform: translateX(-104%); transition: transform .22s cubic-bezier(.2,.9,.3,1.1); display: flex; flex-direction: column; z-index: 5; }
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 2px solid var(--ink); background: var(--panel-2); }
.drawer header h2 { font-size: 20px; flex: 1; }
.drawer header p { margin: 0; font-size: 12px; color: var(--muted); }
.drawer .body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.drawer .locked { padding: 16px; color: var(--muted); }
.card { background: var(--panel-2); border: 2px solid var(--ink); border-radius: 5px; padding: 10px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.07); }
.recruit { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.recruit img { width: 56px; height: 56px; background: #2f5080; border: 2px solid var(--ink); border-radius: 4px; }
.recruit h4 { font-size: 15px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.recruit p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.chip { font-family: var(--f-display); font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--ink); background: var(--line); color: var(--text); white-space: nowrap; }
.chip.race { color: #1a1230; }
.chip.on { box-shadow: 0 0 0 2px var(--gold); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.sold { opacity: 0.4; }
.research { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.research h4 { font-size: 14px; }
.research p { margin: 0; font-size: 12px; color: var(--muted); grid-column: 1; }
.pips { display: flex; gap: 2px; margin-top: 3px; }
.pips i { width: 8px; height: 8px; border: 1px solid var(--ink); background: #1a2048; }
.pips i.on { background: var(--gold); }
.group-title { font-family: var(--f-display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--violet); margin-top: 4px; }
.item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.item img { width: 30px; height: 30px; }
.item h4 { font-size: 14px; }
.item p { margin: 0; font-size: 12px; color: var(--muted); }
.tier { font-family: var(--f-display); font-size: 11px; color: var(--gold); }
.note { font-size: 12px; color: var(--muted); }

/* bottom roster drawer */
.roster { background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); }
.roster > header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
.roster > header h2 { font-size: 17px; }
.roster > header .syn { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 0; }
.roster .rbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 12px; padding: 12px; }
.roster.collapsed .rbody { display: none; }
.cards { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.hcard { width: 118px; border: 2px solid var(--ink); border-radius: 5px; background: var(--panel-2); padding: 6px; display: flex; flex-direction: column; gap: 3px; position: relative; touch-action: none; user-select: none; box-shadow: 0 3px 0 var(--ink); }
.hcard.sel { background: #3d4d99; box-shadow: 0 0 0 2px var(--gold), 0 3px 0 var(--ink); }
.hcard.benched { opacity: 0.75; border-style: dashed; }
.hcard .port { height: 54px; background: #2f5080; border: 2px solid var(--ink); border-radius: 3px; display: flex; align-items: flex-end; justify-content: center; cursor: grab; position: relative; }
.hcard .port img { width: 54px; height: 54px; }
.hcard .lv { position: absolute; top: 2px; left: 3px; font-family: var(--f-display); font-size: 11px; background: var(--ink); padding: 0 4px; border-radius: 2px; }
.hcard .where { position: absolute; top: 2px; right: 3px; font-family: var(--f-display); font-size: 10px; background: var(--ink); padding: 0 4px; border-radius: 2px; color: var(--mint); }
.hcard .where.off { color: var(--rose); }
.hcard b { font-family: var(--f-display); font-weight: 500; font-size: 12px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hcard .live { height: 4px; background: #3a2a4a; border: 1px solid var(--ink); }
.hcard .live i { display: block; height: 100%; background: var(--mint); }
.hcard .dmg { font-family: var(--f-display); font-size: 11px; color: var(--gold); }
.hcard.empty { align-items: center; justify-content: center; color: var(--muted); border-style: dashed; background: transparent; min-height: 120px; box-shadow: none; font-size: 12px; text-align: center; }
.inspector { background: var(--panel-2); border: 2px solid var(--ink); border-radius: 5px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.inspector .top { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; align-items: center; }
.inspector .top img { width: 72px; height: 72px; background: #2f5080; border: 2px solid var(--ink); border-radius: 4px; }
.inspector h3 { font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.stats div { background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; padding: 3px 6px; }
.stats small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.stats span { font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.ability { border-left: 3px solid var(--gold); padding-left: 8px; }
.ability b { font-family: var(--f-display); font-weight: 500; color: var(--gold); }
.ability p { margin: 2px 0 0; font-size: 12px; color: var(--text); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { display: flex; align-items: center; gap: 5px; border: 1px dashed var(--line); padding: 3px 6px; border-radius: 3px; font-size: 12px; }
.slot img { width: 20px; height: 20px; }

/* overlays */
#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; z-index: 6; }
#banner .in { display: inline-block; background: rgba(15,20,48,0.85); border-block: 3px solid var(--gold); padding: 10px 40px; animation: bannerIn 2.4s forwards; }
#banner h2 { font-size: clamp(22px, 4vw, 42px); color: var(--gold); text-shadow: 3px 3px 0 var(--ink); letter-spacing: 0.08em; }
#banner p { margin: 2px 0 0; font-family: var(--f-display); font-size: 16px; }
@keyframes bannerIn { 0% { transform: scaleX(0); opacity: 0; } 10% { transform: scaleX(1.1); opacity: 1; } 15%, 80% { transform: none; opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
#toast div { background: var(--panel-2); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 12px; box-shadow: 0 3px 0 var(--ink); animation: toast 2.6s forwards; font-size: 13px; max-width: 90vw; }
#toast div.err { background: #5a1a36; }
@keyframes toast { 0% { transform: translateY(10px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { opacity: 0; } }
#fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
#fxlayer img { position: absolute; width: 14px; height: 14px; left: 0; top: 0; }
#ghost { position: fixed; pointer-events: none; z-index: 45; width: 60px; height: 60px; transform: translate(-50%, -80%); }

.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(10,12,32,0.72); }
.modal .sheet, #towerPanel .sheet { width: min(560px, 100%); max-height: calc(100% - 16px); overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 6px 0 var(--ink), 0 0 0 3px var(--line) inset; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: sheetIn .3s cubic-bezier(.2,.9,.3,1.2); }
@keyframes sheetIn { from { transform: translateY(20px) scale(.96); opacity: 0; } }
.sheet h2 { font-size: 28px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); }
.sheet .lede { color: var(--muted); margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.tile { background: var(--panel-2); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 10px; }
.tile small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.tile span { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.meter { display: grid; grid-template-columns: 30px minmax(0, 110px) minmax(0, 1fr) 60px; gap: 8px; align-items: center; font-size: 12px; }
.meter img { width: 30px; height: 30px; }
.meter .b { height: 10px; background: #1a2048; border: 1px solid var(--ink); }
.meter .b i { display: block; height: 100%; background: var(--gold); }
.meter .b i.heal { background: var(--mint); }
.meter .v { font-family: var(--f-display); text-align: right; font-variant-numeric: tabular-nums; }
.meter.dead { opacity: 0.55; }
.visitor { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.visitor img { width: 110px; height: 110px; background: radial-gradient(circle, #3a4c9a, #222c5a); border: 3px solid var(--ink); border-radius: 6px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--ink); background: var(--panel-2); border-radius: 5px; padding: 10px 12px; box-shadow: 0 3px 0 var(--ink); display: flex; flex-direction: column; gap: 2px; }
.opt:hover { background: #3d4d99; }
.opt b { font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--gold); }
.opt span { font-size: 12px; color: var(--muted); }
.outcome { background: var(--panel-2); border: 2px solid var(--ink); border-radius: 5px; padding: 10px; font-family: var(--f-display); }

/* title + meta */
#title { position: fixed; inset: 0; z-index: 35; overflow-y: auto; background: radial-gradient(ellipse at 50% 0%, #3a4ca8 0, #1b2350 45%, #121633 100%); padding: 24px 16px; }
#title .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.logo { text-align: center; padding-top: 10px; }
.logo h1 { font-size: clamp(42px, 9vw, 96px); color: var(--gold); letter-spacing: 0.05em; line-height: 0.95;
  text-shadow: 0 4px 0 #c2410c, 0 8px 0 var(--ink), 0 0 40px rgba(255,207,58,0.35); }
.logo p { font-family: var(--f-display); letter-spacing: 0.3em; text-transform: uppercase; color: var(--sky); margin: 14px 0 0; font-size: 13px; }
.parade { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
.parade img { width: 48px; height: 48px; animation: hop 1.2s infinite; }
@keyframes hop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-6px); } }
.cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.cta .btn { font-size: 18px; padding: 10px 18px; }
.metabox { background: var(--panel); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 5px 0 var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.metabox header { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.metabox h2 { font-size: 22px; }
.metagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 8px; }
.metagrid .card { display: flex; flex-direction: column; gap: 4px; }
.metagrid .card p { margin: 0; font-size: 12px; color: var(--muted); flex: 1; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.howto div { background: rgba(15,20,48,0.5); border: 2px solid var(--ink); border-radius: 5px; padding: 10px; font-size: 13px; }
.howto b { font-family: var(--f-display); color: var(--gold); font-weight: 500; display: block; margin-bottom: 2px; }
.records { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.records b { color: var(--text); font-family: var(--f-display); font-weight: 500; }

/* tower ending */
#tower { position: fixed; inset: 0; z-index: 38; background: #0c1028; display: grid; grid-template-rows: minmax(0, 1fr); }
#towerCv { width: 100%; height: 100%; display: block; }
#towerPanel { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(520px, calc(100% - 32px)); }
#towerSkip { position: absolute; top: 12px; right: 16px; z-index: 2; }

}

/* ===== Phase 2: drafts, elements, items, tech tree, coach, notes, sim lab ===== */
.chip.el { background: var(--ec); color: #10122a; border-color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,0.35); }
.chip.st-ad { background: #ff8a4c; color: #2a0f00; } .chip.st-ap { background: var(--violet); color: #150a35; } .chip.st-def { background: #58c7a8; color: #04261c; }
.rolls { display: grid; gap: 3px; margin-top: 6px; }
.rb { display: grid; grid-template-columns: 30px minmax(0,1fr) 34px; gap: 6px; align-items: center; font-family: var(--f-display); font-size: 11px; }
.rb i { display: block; height: 7px; background: var(--ink); border-radius: 2px; overflow: hidden; }
.rb i b { display: block; height: 100%; }
.rb.st-ad i b { background: #ff8a4c; } .rb.st-ap i b { background: var(--violet); } .rb.st-def i b { background: #58c7a8; }
.rb em { font-style: normal; text-align: right; } .rb em small { color: var(--mint); margin-left: 2px; }
.xpbar { height: 5px; background: var(--ink); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), #b9f0ff); }
.xpbar.big { height: 10px; border: 1px solid var(--ink); }
.xpbar.big i { background: linear-gradient(90deg, var(--mint), var(--gold)); }
.sheet.wide { width: min(860px, 100%); }

/* draft */
.draft { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.dcard, .ecard, .lcard { text-align: left; background: var(--panel-2); border: 3px solid var(--ink); border-radius: 7px; padding: 10px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,0.08);
  animation: cardIn .4s cubic-bezier(.2,.9,.3,1.3) both; transition: transform .12s, box-shadow .12s; }
.dcard:hover, .ecard:hover, .lcard:hover { transform: translateY(-4px); box-shadow: 0 8px 0 var(--ink), 0 0 0 3px var(--gold); }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) rotate(-3deg) scale(.9); } }
.dport { position: relative; background: radial-gradient(circle at 50% 60%, #4a5cb0, #222c5a 70%); border: 2px solid var(--ink); border-radius: 5px; display: grid; place-items: center; height: 96px; }
.dport img { width: 80px; height: 80px; }
.dport .stars { position: absolute; top: 4px; right: 6px; }
.dcard h3 { font-size: 18px; }
.dtot { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-display); font-size: 12px; color: var(--muted); margin-top: 4px; }
.dtot b { color: var(--gold); font-size: 15px; }

/* elements */
.elcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.ecard { border-color: var(--ink); background: linear-gradient(170deg, color-mix(in srgb, var(--ec) 28%, var(--panel-2)), var(--panel-2) 55%); }
.ecard h3 { color: var(--ec); text-shadow: 1px 1px 0 var(--ink); font-size: 18px; }
.ecard p { margin: 0; font-size: 13px; }
.ecard small { color: var(--muted); font-size: 11px; }
.ecard small.cmb { color: var(--gold); }
.ecard em { font-family: var(--f-display); font-style: normal; color: var(--ec2); font-size: 12px; }
.eorb { height: 90px; border-radius: 50%; width: 90px; align-self: center; display: grid; place-items: center; border: 3px solid var(--ink);
  background: radial-gradient(circle at 40% 35%, var(--ec2), var(--ec) 60%, #10122a); box-shadow: 0 0 22px var(--ec); animation: orb 2.4s ease-in-out infinite; }
.eorb img { width: 70px; height: 70px; }

@keyframes orb { 50% { box-shadow: 0 0 34px var(--ec); transform: translateY(-2px); } }
.ecard .pw { font-family: var(--f-display); color: var(--gold); }

/* loot */
.loot { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.lcard { align-items: center; text-align: center; }
.lcard img { width: 64px; height: 64px; }
.lcard b { font-family: var(--f-display); font-size: 15px; color: var(--gold); }
.lcard span { font-size: 12px; color: var(--muted); }

/* report */
.xprep { display: flex; flex-direction: column; gap: 6px; }
.xrow { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 8px; align-items: center; background: var(--panel-2); border: 2px solid var(--ink); border-radius: 5px; padding: 5px 8px; }
.xrow img { width: 36px; height: 36px; }

.xpgain { color: var(--mint); font-family: var(--f-display); font-size: 12px; margin-left: 6px; }
.xplost { color: var(--rose); font-family: var(--f-display); font-size: 12px; margin-left: 6px; }
.lvl { text-align: right; font-family: var(--f-display); display: flex; flex-direction: column; align-items: flex-end; }
.lvup { color: var(--gold); font-size: 13px; animation: lvup .6s steps(2) infinite alternate; text-shadow: 1px 1px 0 var(--ink); }
@keyframes lvup { to { color: #fff; transform: scale(1.08); } }

/* armory */
.loadout .lslots { display: grid; gap: 6px; margin-top: 8px; }
.lslot { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 8px; align-items: start; background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; padding: 6px; }

.lslot.fin { border-color: var(--gold); }
.lslot.empty { display: block; color: var(--muted); font-family: var(--f-display); font-size: 12px; text-align: center; border-style: dashed; border-color: var(--line); }
.card.item { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 8px; align-items: center; }

.recipes { margin-top: 8px; } .recipes summary { font-family: var(--f-display); cursor: pointer; color: var(--gold); padding: 4px 0; }

.rc { padding: 1px; background: var(--panel-2); border: 1px solid var(--ink); border-radius: 3px; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }

.rdesc { font-size: 13px; background: var(--panel-2); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 8px; }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.cx { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--muted); opacity: .45; }
.cx img { width: 36px; height: 36px; } .cx.own { opacity: 1; color: var(--gold); }

/* tech tree */
.tbranch { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 3px 1px 6px; }
.ttier { display: flex; flex-direction: column; gap: 4px; }
.tarrow { color: var(--line); font-family: var(--f-display); font-size: 18px; }
.tnode { min-width: 92px; text-align: left; background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; padding: 4px 6px; display: flex; flex-direction: column; font-size: 11px; box-shadow: 0 2px 0 var(--ink); }
.tnode b { font-family: var(--f-display); font-weight: 500; font-size: 12px; } .tnode span { color: var(--muted); display: inline-flex; gap: 3px; align-items: center; }
.tnode img.px { width: 11px; height: 11px; }
.tnode.locked { opacity: .45; } .tnode.hidden { opacity: .4; border-style: dashed; }
.tnode.done { background: #1f5a44; border-color: var(--mint); } .tnode.done span { color: var(--mint); }
.tnode.open { border-color: var(--sky); } .tnode.open.afford { box-shadow: 0 0 0 2px var(--gold), 0 0 12px var(--gold); animation: glow 1.4s ease-in-out infinite; }
.tnode.sel { outline: 2px solid #fff; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px var(--gold), 0 0 4px var(--gold); } }
.tsecret { display: flex; flex-wrap: wrap; gap: 4px; }
.techdetail { border-color: var(--gold); }

/* intel */
.mods p { margin: 3px 0; font-size: 12px; color: var(--gold); }
small.res { color: var(--gold); font-size: 10px; margin-right: 4px; }
.combo { font-size: 12px; margin: 3px 0; } .combo b { color: var(--gold); font-family: var(--f-display); }

/* castle power */
.powerbtn { position: relative; overflow: hidden; background: var(--ec, var(--violet)); color: #10122a; }
.powerbtn .cdfill, .hammerbtn .cdfill { position: absolute; inset: 0; background: rgba(10,12,32,0.6); transform-origin: left; pointer-events: none; }
[data-badge] { position: relative; }
[data-badge]:not([data-badge=""])::after { content: attr(data-badge); position: absolute; top: -6px; right: -6px; background: var(--rose); color: #fff; font-family: var(--f-display); font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; border: 2px solid var(--ink); }
.rail button.bump { animation: bump .3s; }

/* coach highlight */
.spot { position: relative; z-index: 25; box-shadow: 0 0 0 3px var(--gold), 0 0 0 9999px rgba(8,10,28,0.55) !important; animation: spot 1.2s ease-in-out infinite; border-radius: 6px; }
@keyframes spot { 50% { box-shadow: 0 0 0 6px var(--gold), 0 0 0 9999px rgba(8,10,28,0.55); } }
#coach { position: fixed; z-index: 26; background: var(--gold); color: #2a1a00; border: 3px solid var(--ink); border-radius: 6px; padding: 10px 12px; box-shadow: 0 4px 0 var(--ink); font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; animation: sheetIn .3s; }
#coach p { margin: 0; align-self: stretch; }
#coach .btn.primary { background: var(--night); color: var(--gold); }

/* notes panel and sim lab */
#notes, #lab { position: fixed; z-index: 40; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10,12,32,0.72); }
.panel { width: min(640px, 100%); max-height: calc(100% - 16px); overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 6px 0 var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

.panel textarea { min-height: 90px; resize: vertical; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }

.microw { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.microw .rec { background: var(--rose); color: #2a0010; }
.microw .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rose); animation: lvup .5s steps(2) infinite alternate; }
.nlist { display: flex; flex-direction: column; gap: 6px; }
.nitem { background: var(--panel-2); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 8px; font-size: 13px; }
.nitem header { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-display); font-size: 11px; color: var(--muted); }
.nitem .k { color: var(--ink); background: var(--gold); padding: 0 5px; border-radius: 3px; }
.nitem .k.bug { background: var(--rose); } .nitem .k.gripe { background: #ff8a4c; } .nitem .k.idea { background: var(--mint); } .nitem .k.balance { background: var(--sky); } .nitem .k.error { background: #ff3b3b; color: #fff; }
.nitem .done { text-decoration: line-through; opacity: .6; }
.labbar { height: 8px; background: var(--ink); border-radius: 3px; overflow: hidden; } .labbar i { display: block; height: 100%; background: var(--mint); width: 0; transition: width .2s; }

table.lab th, table.lab td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
table.lab th { font-family: var(--f-display); color: var(--muted); font-weight: 500; }
.cta.small .btn { font-size: 13px; padding: 5px 10px; }
@media (max-width: 860px) { .controls #notesBtn { display: none; } }
.ecard .chip { align-self: flex-start; }
.eorb.castle { height: 120px; border-radius: 6px; background: linear-gradient(var(--ec2), color-mix(in srgb, var(--ec) 40%, #222c5a)); overflow: hidden; align-items: end; }

body:has(#modal:not([hidden])) #coach, body:has(#notes:not([hidden])) #coach, body:has(#lab:not([hidden])) #coach, body:has(#title:not([hidden])) #coach { display: none; }
body:has(#modal:not([hidden])) .spot, body:has(#title:not([hidden])) .spot { animation: none; box-shadow: none !important; }

#coach { font-size: 15px; }
.hpick { display: flex; gap: 6px; flex-wrap: wrap; }

.hp .pips { display: flex; gap: 2px; } .hp .pips b { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); border: 1px solid var(--line); } .hp .pips b.on { background: var(--gold); }
.hp.on .pips b.on { background: #fff; }
.tlist { display: flex; flex-direction: column; gap: 5px; }
.trow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; background: var(--panel-2); border: 2px solid var(--ink); border-radius: 5px; padding: 6px 8px; }

.sb { flex: 0 0 186px; }

/* keep ledger tabs, class specs, achievements */

function superKind(a, b) {
  const n = {}, all = [...a.parts, ...b.parts].filter(p => p !== 'spatula');
  for (const p of all) n[p] = (n[p] || 0) + 1;
  let best = all[0] || 'sword'; for (const p of all) if (n[p] > n[best]) best = p; return best;
}

function itemDesc(it) {
  if (it.sup) return `Super item: ${finishedName(it.parts, it.el)} + ${finishedName(it.sub.parts, it.sub.el)}, with both of their powers. ${SUPERS[it.sup][1]}`;

// ===== Procedural pixel sprites (original art, built from layered shapes) =====
const OUTLINE = '#1a1230';

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function shade(h, f) { const [r, g, b] = hexToRgb(h); return f < 0 ? rgbToHex(r * (1 + f), g * (1 + f), b * (1 + f)) : rgbToHex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f); }

class PixGrid {
  constructor(w, h) { this.w = w; this.h = h; this.p = new Array(w * h).fill(null); this.flat = new Set(); }
  set(x, y, c, flat) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h || !c) return; this.p[y * this.w + x] = c; if (flat) this.flat.add(y * this.w + x); else this.flat.delete(y * this.w + x); }
  get(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null; return this.p[y * this.w + x]; }
  rect(x0, y0, x1, y1, c, flat) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, c, flat); }
  clear(x, y) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.p[y * this.w + x] = null; }
  finish() {
    // soft volume: back (left) edge darker, top edge lighter
    const out = this.p.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const i = y * this.w + x, c = this.p[i]; if (!c || this.flat.has(i)) continue;
      if (!this.get(x - 1, y)) out[i] = shade(c, -0.22);
      else if (!this.get(x, y - 1)) out[i] = shade(c, 0.18);
      else if (!this.get(x, y + 1)) out[i] = shade(c, -0.12);
    }
    // outline
    const o = out.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (out[y * this.w + x]) continue;
      const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < this.w && yy < this.h && out[yy * this.w + xx];
      if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) o[y * this.w + x] = OUTLINE;
    }
    this.p = o; return this;
  }
  toCanvas(flip, white) {
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
    const ctx = c.getContext('2d'); const img = ctx.createImageData(this.w, this.h);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const col = this.p[y * this.w + x]; if (!col) continue;
      const tx = flip ? this.w - 1 - x : x; const j = (y * this.w + tx) * 4;
      const [r, g, b] = white ? [255, 255, 255] : hexToRgb(col);
      img.data[j] = r; img.data[j + 1] = g; img.data[j + 2] = b; img.data[j + 3] = 255;
    }
    ctx.putImageData(img, 0, 0); return c;
  }
}

function drawWeapon(g, s, type, hx, hy, atk) {
  const metal = s.metal || '#dfe6f5', wood = '#9a6332', gold = '#ffcf3a';
  switch (type) {
    case 'sword':
      if (!atk) { g.rect(hx + 1, hy - 8, hx + 1, hy - 2, metal); g.set(hx + 1, hy - 9, '#ffffff'); g.rect(hx, hy - 1, hx + 2, hy - 1, gold); g.set(hx + 1, hy, wood); }
      else { g.rect(hx + 2, hy, hx + 7, hy, metal); g.set(hx + 8, hy, '#ffffff'); g.rect(hx + 1, hy - 1, hx + 1, hy + 1, gold); }
      break;
    case 'axe':
      if (!atk) { g.rect(hx + 1, hy - 8, hx + 1, hy + 1, wood); g.rect(hx + 2, hy - 8, hx + 4, hy - 5, metal); g.set(hx + 4, hy - 9, metal); g.set(hx + 4, hy - 4, metal); }
      else { g.rect(hx + 1, hy, hx + 5, hy, wood); g.rect(hx + 5, hy - 3, hx + 7, hy - 1, metal); g.rect(hx + 6, hy + 1, hx + 7, hy + 1, metal); }
      break;
    case 'hammer':
      if (!atk) { g.rect(hx + 1, hy - 6, hx + 1, hy + 2, wood); g.rect(hx - 1, hy - 10, hx + 3, hy - 6, metal); g.rect(hx - 1, hy - 8, hx + 3, hy - 8, shade(metal, -0.25)); }
      else { g.rect(hx + 1, hy, hx + 4, hy, wood); g.rect(hx + 4, hy - 3, hx + 7, hy + 2, metal); g.rect(hx + 5, hy - 3, hx + 5, hy + 2, shade(metal, -0.25)); }
      break;
    case 'staff': {
      const gem = s.gem || '#7cf0ff';
      g.rect(hx + 1, hy - 8, hx + 1, hy + 5, wood);
      g.rect(hx, hy - 11, hx + 2, hy - 9, gem, true); g.set(hx + 1, hy - 10, '#ffffff', true);
      if (atk) { g.set(hx + 3, hy - 10, gem, true); g.set(hx - 1, hy - 10, gem, true); g.set(hx + 1, hy - 12, gem, true); }
      break; }
    case 'totem': {
      const gem = s.gem || '#ff5d8f';
      g.rect(hx + 1, hy - 7, hx + 1, hy + 5, wood);
      g.rect(hx - 1, hy - 11, hx + 3, hy - 8, '#f1ecdc'); g.set(hx, hy - 10, OUTLINE, true); g.set(hx + 2, hy - 10, OUTLINE, true);
      g.set(hx - 1, hy - 7, gem, true); g.set(hx + 3, hy - 7, gem, true);
      if (atk) { g.set(hx + 4, hy - 12, gem, true); g.set(hx - 2, hy - 12, gem, true); }
      break; }
    case 'bow':
      g.rect(hx + 3, hy - 5, hx + 3, hy + 3, wood); g.set(hx + 2, hy - 6, wood); g.set(hx + 2, hy + 4, wood); g.set(hx + 1, hy - 7, wood); g.set(hx + 1, hy + 5, wood);
      if (!atk) g.rect(hx + 1, hy - 6, hx + 1, hy + 4, '#f4f1ff', true);
      else { g.set(hx, hy - 5, '#f4f1ff', true); g.set(hx - 1, hy - 1, '#f4f1ff', true); g.set(hx, hy + 3, '#f4f1ff', true); g.rect(hx - 1, hy - 1, hx + 6, hy - 1, '#c9a06a'); g.set(hx + 7, hy - 1, '#e8eefc'); }
      break;
    case 'daggers':
      if (!atk) { g.rect(hx + 1, hy - 4, hx + 1, hy - 1, metal); g.set(hx + 1, hy, gold); g.rect(hx - 8, hy - 3, hx - 8, hy, metal); }
      else { g.rect(hx + 2, hy - 1, hx + 6, hy - 1, metal); g.set(hx + 1, hy - 1, gold); g.rect(hx + 1, hy + 2, hx + 4, hy + 2, metal); }
      break;
    case 'spear':
      if (!atk) { g.rect(hx + 1, hy - 10, hx + 1, hy + 5, wood); g.rect(hx + 1, hy - 13, hx + 1, hy - 11, metal); g.set(hx, hy - 11, metal); g.set(hx + 2, hy - 11, metal); }
      else { g.rect(hx - 3, hy, hx + 4, hy, wood); g.rect(hx + 5, hy, hx + 7, hy, metal); g.set(hx + 5, hy - 1, metal); g.set(hx + 5, hy + 1, metal); }
      break;
    case 'cannon':
      g.rect(hx - 3, hy - 3, hx + (atk ? 4 : 3), hy - 1, metal); g.rect(hx + (atk ? 5 : 4), hy - 4, hx + (atk ? 5 : 4), hy, shade(metal, -0.3));
      g.rect(hx - 3, hy, hx - 2, hy, wood);
      if (atk) { g.set(hx + 6, hy - 2, '#ffde3a', true); g.set(hx + 7, hy - 3, '#ff8a3a', true); g.set(hx + 7, hy - 1, '#ff8a3a', true); }
      break;
    case 'shield': {
      const off = atk ? 2 : 0, a2 = s.armor2 || '#6c7fb8';
      g.rect(hx - 1 + off, hy - 4, hx + 3 + off, hy + 2, metal); g.rect(hx + off, hy + 3, hx + 2 + off, hy + 3, metal);
      g.rect(hx + off, hy - 3, hx + 2 + off, hy + 1, a2); g.set(hx + 1 + off, hy - 1, s.cape || s.cloth || '#ffcf3a', true);
      break; }
  }
}

function genHumanoid(s, frame) {
  const g = new PixGrid(20, 20);
  const by = frame === 'idle1' ? 1 : 0, atk = frame === 'atk';
  const skin = s.skin, a1 = s.armor, a2 = s.armor2 || shade(a1, -0.3), cl = s.cloth || a2, hair = s.hair || shade(skin, -0.4);
  const gob = s.head === 'goblin', hy = gob ? 2 : 0;
  // cape
  if (s.cape) g.rect(4, 11 + by, 5, 17, s.cape);
  // legs
  const boot = shade(a2, -0.35);
  const leg = (x, lift) => { g.rect(x, 16, x + 1, 18 - lift, cl); g.rect(x, 18 - lift, x + 2, 18 - lift, boot); };
  if (frame === 'walk0') { leg(6, 0); leg(11, 1); } else if (frame === 'walk1') { leg(8, 1); leg(10, 0); } else if (atk) { leg(6, 0); leg(11, 0); } else { leg(7, 0); leg(10, 0); }
  // back arm
  g.rect(5, 12 + by, 5, 14 + by, a2); g.set(5, 15 + by, skin);
  // torso
  if (s.head === 'skeleton' && !s.armor) { g.rect(8, 11, 10, 15, skin); }
  g.rect(6, 11 + by, 12, 15, a1); g.rect(6, 11 + by, 12, 11 + by, a2); g.rect(6, 14, 12, 14, cl); g.set(9, 12 + by, shade(a1, 0.35)); g.set(9, 14, '#ffcf3a', true);
  if (s.head === 'toad') g.rect(8, 12 + by, 11, 13 + by, s.belly || shade(skin, 0.4));
  // head
  const hx0 = gob ? 6 : 5, hx1 = gob ? 12 : 13, hy0 = 3 + by + hy, hy1 = 10 + by;
  if (s.head === 'toad') {
    g.rect(4, 4 + by, 14, 10 + by, skin); g.clear(4, 4 + by); g.clear(14, 4 + by);
    g.rect(6, 8 + by, 13, 10 + by, s.belly || shade(skin, 0.4));
    g.rect(6, 1 + by, 8, 4 + by, skin); g.rect(11, 1 + by, 13, 4 + by, skin);
    g.rect(7, 2 + by, 8, 3 + by, '#ffffff', true); g.set(8, 3 + by, OUTLINE, true);
    g.rect(12, 2 + by, 13, 3 + by, '#ffffff', true); g.set(13, 3 + by, OUTLINE, true);
    g.rect(8, 8 + by, 14, 8 + by, shade(skin, -0.5), true); g.set(5, 7 + by, '#ff8fb0', true);
  } else {
    g.rect(hx0, hy0, hx1, hy1, skin); g.clear(hx0, hy0); g.clear(hx1, hy0); g.clear(hx0, hy1); g.clear(hx1, hy1);
    const eye = s.eye || OUTLINE;
    if (s.head === 'skeleton') {
      g.rect(8, 5 + by, 9, 6 + by, OUTLINE, true); g.rect(11, 5 + by, 12, 6 + by, OUTLINE, true);
      g.set(9, 6 + by, s.eye || '#ff5d8f', true); g.set(12, 6 + by, s.eye || '#ff5d8f', true);
      g.set(10, 7 + by, OUTLINE, true); g.rect(8, 9 + by, 12, 9 + by, shade(skin, -0.25), true); g.set(9, 9 + by, OUTLINE, true); g.set(11, 9 + by, OUTLINE, true);
      if (!s.armor || s.cloth) { g.rect(7, 12 + by, 11, 12 + by, shade(a1, 0.1)); }

function genSlime(s, frame) {

  g.set(x0 + (sm ? 3 : 4), y0 + 2, '#ffffff', true); g.set(x0 + (sm ? 3 : 4), y0 + 3, shade(c, 0.5), true);

const GENS = { humanoid: genHumanoid, slime: genSlime, quad: genQuad, flyer: genFlyer, golem: genGolem, bird: genBird };
const FRAMES = ['idle0', 'idle1', 'walk0', 'walk1', 'atk'];
const SPR = {};   // key -> { frames: {name: canvas}, white: {name: canvas}, scale }

function buildSprite(key, spec, flip, scale = 1) {
  const gen = GENS[spec.gen || 'humanoid'];
  const out = { frames: {}, white: {}, scale };
  for (const f of FRAMES) { const g = gen(spec, f); out.frames[f] = g.toCanvas(flip); out.white[f] = g.toCanvas(flip, true); }
  SPR[key] = out; return out;
}

function buildAllSprites() {
  for (const h of HEROES) buildSprite('h:' + h.id, h.spr, false);
  for (const [id, e] of Object.entries(ENEMIES)) buildSprite('e:' + id, e.spr, true, e.scale || 1);
  buildSprite('thrall', { head: 'skeleton', skin: SK.bone, hat: 'none', armor: '#6a5a8a', armor2: '#3a2f5a', cloth: '#3a2f5a', weapon: 'sword', metal: '#c8c0b0' }, false);
  buildSprite('spirit', { gen: 'quad', body: '#9ff6ff', belly: '#ffffff', eye: '#2a4a8a', horns: true }, false);
  buildSprite('crit:ghost', { gen: 'flyer', body: '#ffffff', wing: '#e8e4ff', eye: '#1a1230', glow: true }, false);
  buildSprite('crit:meatman', { gen: 'golem', body: '#ff8a8a', trim: '#ffd0b0', eye: '#1a1230', small: true }, false);
  buildSprite('crit:dog', { gen: 'quad', body: '#c98a4a', belly: '#f3dcc0', eye: '#1a1230' }, false);
  buildSprite('npc:chicken', ENEMIES.chicken.spr, false);
}
// elemental variations are built on demand: key 'h:<id>:<element>'
function ensureSprite(key) {
  if (SPR[key]) return SPR[key];
  const m = /^h:([a-z]+):([a-z]+)$/.exec(key); if (!m) return null;
  const d = HERO_BY_ID[m[1]], E = ELEMENTS[m[2]]; if (!d || !E) return null;
  const dark = c => shade(c, -0.35);
  const spec = Object.assign({}, d.spr, { armor: E.col, armor2: dark(E.col), cloth: E.col2, gem: E.col, plume: E.col2, hornCol: E.col2 });
  if (d.spr.cape) spec.cape = E.col2;
  if (d.spr.hair) spec.hair = E.col2 === '#0f0a2a' ? '#5a3aff' : E.col2;
  return buildSprite(key, spec, false);
}

// ----- step -----
function stepBattle(B, dt) {
  if (B.done) return;
  B.t += dt;
  const run = B.run;
  while (B.queue.length && B.queue[0].t <= B.t) { const q = B.queue.shift();
    if (q.event) { B.wave = q.wave; B.waves_of = q.of; if (q.event === 'surge') { FX.combo(W / 2, 46, 'THE HORDE SURGES', ['#ff3d6e', '#ffd84a']); FX.shake(8); FX.sound('roar'); FX.surge && FX.surge(q.n); } else { FX.combo(W / 2, 46, `WAVE ${q.wave}`, ['#ffd84a', '#ffffff']); FX.sound('boss'); } continue; }
    spawnEnemy(B, q.id, { sw: q.sw, rush: q.rush }); B.lastSpawn = B.t; }
  // overtime: once the last foe has arrived and the fight drags on, heroes hit harder every second.
  // Normal foes still standing after a while stop fighting and charge the wall instead, so a siege always ends.
  if (!B.overtime && !B.queue.length && !(B.bossUnit && B.bossUnit.alive) && B.t - Math.max(B.lastSpawn || 0, B.bossGoneT || 0) > BAL.otStart) {
    B.overtime = true; B.otT = 0; FX.banner('OVERTIME', 'Heroes hit harder. Stragglers will charge the wall.'); FX.sound('boss'); }
  if (B.overtime) B.otT = (B.otT || 0) + dt;
  B.bulwarkT += dt; if (B.bulwarkT >= 12) { B.bulwarkT = 0; applyBulwark(B); }
  const banner = 1 + 0.15 * (B.meta.ranks.banners || 0);
  const anyFoe = B.enemies.some(e => e.alive);
  // regen: cleric synergy, hot tub, nature, troll blood, water below half
  for (const h of B.heroes) if (h.alive && h.st) {
    let r = (B.syn.cleric >= 0 ? [0.01, 0.025][B.syn.cleric] * banner : 0) + (run.tech.hottub ? 0.012 : 0) + (h.st.regen || 0);
    if (h.st.el && h.st.el.water && h.hp < h.maxHp * 0.5) r += 0.03 * h.st.el.water;
    if (r) h.hp = Math.min(h.maxHp, h.hp + h.maxHp * r * dt);
    if (h.st.sp && h.st.sp.fountain && h.st.sigOn) h.mana = Math.min(h.maxMana, h.mana + 4 * dt);
  }
  // sweet aura + frozen heart + sunfire
  const sweet = B.heroes.filter(h => h.alive && h.st && h.st.el && h.st.el.sweet);
  for (const h of B.heroes) if (h.alive) h.auraAs = sweet.some(s => dist(s, h) < 60) ? 0.15 * Math.max(...sweet.map(s => s.st.el.sweet)) : 0;
  B.kettleT += dt; const tick = B.kettleT >= 1; if (tick) B.kettleT = 0;
  for (const h of B.heroes) if (h.alive && h.st && h.st.sp) {
    if (h.st.sp.frozenHeart) for (const e of inRadius(B.enemies, h, 40)) { e.slowT = Math.max(e.slowT, 0.3); e.slowAmt = Math.max(e.slowAmt, 0.25); }
    if (tick && h.st.sp.sunfire) for (const e of inRadius(B.enemies, h, 26)) dealDamage(B, h, e, h.maxHp * 0.03, { noProc: true, kind: 'magic', from: 'item' });
    if (h.st.sp.redemption) { h.redT = (h.redT || 0) + dt; if (h.redT >= 10) { h.redT = 0; for (const a of B.heroes) if (a.alive) healUnit(B, h, a, a.maxHp * 0.12, false, 'item'); FX.ring(h.x, h.y - 6, 30, '#7cf09a'); FX.sound('heal'); } }
  }
  // combos
  if (anyFoe) for (const c of B.combos) { c.t += dt; if (c.t >= c.every) { c.t = 0; comboPulse(B, c); } }
  // secrets
  if (run.tech.bard && anyFoe) { B.bardT -= dt; if (B.bardT <= 0) { B.bardT = 18; for (const h of B.heroes) if (h.alive) { h.buffAs = Math.max(h.buffAs, 0.4); h.buffAsT = 5; } FX.combo(70, 40, '♪ The bard drops a banger ♪', ['#ff9fd0', '#ffd84a']); FX.sound('jingle'); } }
  if (run.tech.cheese && anyFoe) { B.cheeseT -= dt; if (B.cheeseT <= 0) { B.cheeseT = 7; B.waves.push({ type: 'cheese', x: CASTLE_X, y: GRID.y + randi(0, GRID.rows - 1) * GRID.cell + 14, vx: 150, life: 2.6, t: 0, src: null, dmg: teamAtk(B) * 1.4, hit: new Set(), kb: 30, h: 12 }); FX.sound('whoosh'); } }
  if (run.tech.goose) { B.gooseT -= dt; if (B.gooseT <= 0) { B.gooseT = 1; for (const e of B.enemies) if (e.alive && !e.flying && e.x < CASTLE_X + 14) { dealDamage(B, null, e, e.maxHp * (e.boss ? 0.005 : 0.05), { kind: 'combo' }); if (Math.random() < 0.3) { FX.text(e.x, e.y - 22, 'HONK', '#ffffff', true); FX.sound('honk'); } } } }
  if (B.pinataT > 0) B.pinataT -= dt;
  if (B.cpow.cd > 0) B.cpow.cd -= dt;
  // hammer
  const hm = B.hammer; if (hm.cd > 0) hm.cd -= dt;

      case 'recruit': { if (run.lastRecruit != null && run.siege - run.lastRecruit < RECRUIT_GAP) { const g = Math.round(35 * goldMul(run.siege)); run.gold += g; out.push(`The champion takes one look at your crowded barracks and leaves ${g} gold as an apology.`); break; } run.lastRecruit = run.siege;
        if (run.roster.length < ROSTER_CAP && Math.random() < 0.8) { run.recruitFrom = 'encounter'; run.post.unshift('draft'); out.push('Three champions step forward. You get to pick one.'); break; } const os = run.roster.length < ROSTER_CAP ? draftOptions(run, meta) : []; const o = os[0]; if (!o) { const g = Math.round(40 * goldMul(run.siege)); run.gold += g; out.push(`Your keep is full, so they pay ${g} gold for the trouble instead.`); break; } const h = addDraftedHero(run, o); out.push(`${HERO_BY_ID[h.id].name} joins your keep at level ${h.level}!`); break; }
      case 'heal': { const a = Math.round(run.castle.max * n / 100); run.castle.hp = Math.min(run.castle.max, run.castle.hp + a); out.push(`Castle repaired by ${a}.`); break; }
      case 'maxhp': if (run.gold >= 50) { run.gold -= 50; run.maxhpMul *= 1.15; const old = run.castle.max; run.castle.max = castleMaxFor(run, meta); run.castle.hp += run.castle.max - old; out.push('Castle max HP +15%.'); } else out.push('You could not afford the masons. They leave, still eating your bread.'); break;
      case 'diamonds': { const g = Math.round(20 * n * goldMul(run.siege)); run.gold += g; out.push(`+${g} gold`); break; } // diamonds only come from achievements now
      case 'mustache': { const c = run.roster.filter(h => !h.mustache); const h = pick(c.length ? c : run.roster); if (h) { h.mustache = true; out.push(`${heroDisplayName(h)} now has a magnificent mustache. +1 to every rolled stat.`); } break; }
      case 'duel': { const h = run.roster.slice().sort((a, b) => b.level - a.level)[0]; if (!h) break; if (Math.random() < 0.7) { const v = Math.round(70 * (1 + 0.1 * run.siege)); const l = addXP(h, v); if (l) levels.push([h, l]); out.push(`${heroDisplayName(h)} wins after a tense 40 minutes. +${v} XP. The chicken demands a rematch.`); } else { h.rolls.def = Math.min(10, h.rolls.def + 1); out.push(`The chicken wins. ${heroDisplayName(h)} is humbled and gains +1 Defense from the experience.`); } break; }
      case 'gamble': { const h = pick(run.roster); if (!h) break; if (Math.random() < 0.55) { const v = Math.round(160 * (1 + 0.12 * run.siege)); const l = addXP(h, v); if (l) levels.push([h, l]); out.push(`${heroDisplayName(h)} glows, hiccups, and gains ${v} XP.`); } else { run.mods.shrunk = h.uid; out.push(`${heroDisplayName(h)} is now four inches tall for the next siege. They are furious.`); } break; }
      case 'haggle': if (Math.random() < 0.5) { run.stash.push(makeItem([pick(COMP_KEYS)]), makeItem([pick(COMP_KEYS)])); out.push('The dragon respects your hustle. Two free components.'); } else { const a = Math.round(run.castle.max * 0.1); run.castle.hp = Math.max(1, run.castle.hp - a); out.push(`The dragon sneezes. The castle loses ${a} HP and smells like toast.`); } break;
    }
  }
  const modText = { fewer: 'The next siege will be smaller.', curse: 'The next horde is angry about taxes.', chickens: 'Chickens. So many chickens. They are coming next siege.', partyhats: 'The next horde is wearing party hats.', giant: 'Your heroes will be ENORMOUS next siege.', tiny: 'The next horde will be tiny and zoomy.', inspire: 'Heroes +25% attack next siege.', tonic: 'Heroes start the next siege at full mana.', honked: 'The goose will be at the next siege.' };
  for (const fx of fxs.split(',')) { const [k, a] = fx.split(':'); if (k === 'mod' && modText[a]) out.push(modText[a]); }
  run.stats.encounters.push({ s: run.siege, fx: fxs });
  return { out, levels };
}

// ----- siege end bookkeeping -----
function finishSiege(run, meta, B) {
  const s = run.siege; const bounty = Math.round(0.5 * (3 + s) * (1 + (run.tech.vault1 ? 0.15 : 0) + (run.tech.vault2 ? 0.2 : 0)));
  run.gold += bounty;
  const xpMul = 1 + (run.tech.drill ? 0.15 : 0) + (run.tech.college ? 0.25 : 0);
  const survive = BAL.xpSurvive + BAL.xpSurviveS * s;
  const rep = { siege: s, faction: FACTIONS[factionIndex(s)].name, gold: B.goldEarned + bounty, bounty, kills: B.kills, castleLost: Math.round(B.castleStart - run.castle.hp), time: Math.round(B.t), drops: B.drops.slice(), heroes: [], bossFled: B.bossFled || null, fled: B.fled || 0 };
  for (const u of B.heroes.filter(h => !h.temp)) {
    const h = u.inst; const fromLv = h.level, fromXp = h.xp;
    const gained = u.alive ? Math.round((u.xp + survive) * xpMul) : 0;
    const lv = addXP(h, gained);
    if (!u.alive) run.stats.deaths++;
    const bs = heroBattleStats(B, u);
    rep.heroes.push({ uid: h.uid, id: h.id, dmg: Math.round(bs.dmg), heal: Math.round(bs.heal), taken: Math.round(bs.taken), cc: bs.cc, ccT: bs.ccT, dsrc: bs.dsrc, hsrc: bs.hsrc, tsrc: bs.tsrc, kills: u.kills, alive: u.alive,
      xp: gained, lost: u.alive ? 0 : Math.round(u.xp * xpMul), fromLv, fromXp, toLv: h.level, toXp: h.xp, levels: lv });
  }
  run.lastStats = rep.heroes.map(h => ({ uid: h.uid, id: h.id, alive: h.alive, dmg: h.dmg, heal: h.heal, taken: h.taken, ccT: h.ccT, cc: h.cc, dsrc: h.dsrc, hsrc: h.hsrc, tsrc: h.tsrc }));
  for (const h of rep.heroes) run.stats.dmgByHero[h.id] = (run.stats.dmgByHero[h.id] || 0) + h.dmg;
  for (const key of B.drops) run.stash.push(makeItem([key]));
  if (run.tech.mimic && s % 3 === 0) { const key = pick(COMP_KEYS); run.stash.push(makeItem([key])); rep.mimic = key; }
  run.stats.kills += B.kills; run.stats.gold += rep.gold;
  const A = run.stats.ach = run.stats.ach || {}; for (const k in B.ach || {}) A[k] = (A[k] || 0) + B.ach[k];
  if (B.bossKilled && run.mods.bossmad) A.mad = (A.mad || 0) + 1; if (B.bossKilled && run.mods.bosssoft) A.soft = (A.soft || 0) + 1;
  A.maxGold = Math.max(A.maxGold || 0, run.gold); if (run.castle.hp >= run.castle.max) A.fullWalls = Math.max(A.fullWalls || 0, s); A.maxRoster = Math.max(A.maxRoster || 0, run.roster.length);
  if (B.bossKilled) { run.stats.bosses.push({ siege: s, kind: B.bossKilled });
    const old = run.castle.max; run.castle.max = castleMaxFor(run, meta); const grow = run.castle.max - old, fix = Math.round(run.castle.max * 0.25);
    run.castle.hp = Math.min(run.castle.max, run.castle.hp + grow + fix); rep.castleGrow = { from: old, to: run.castle.max, trophy: FACTIONS[factionIndex(s)].name }; }
  if (run.tech.fountain) { const a = Math.round(run.castle.max * 0.1); run.castle.hp = Math.min(run.castle.max, run.castle.hp + a); rep.repaired = a; }
  run.history.push({ s, t: rep.time, kills: rep.kills, gold: rep.gold, castle: Math.round(run.castle.hp), heroes: rep.heroes.map(h => ({ id: h.id, lv: h.toLv, dmg: h.dmg, alive: h.alive })) });
  run.mods = {};
  run.siege++; run.lootRerolls = 0;
  return rep;
}

// the story chapter for the encounter that plays now, or null for a random visitor.
// run.siege is the siege about to be fought, so the siege just finished is run.siege - 1.
function storyChapter(run) {
  const done = run.siege - 1; if (done < 1 || cycleOf(done)) return null;
  const p = done % 5, f = factionIndex(done);
  const ch = (STORY[f] || []).find(c => c.p === p); if (!ch) return null;
  const id = `story${f}_${p}`; if ((run.storySeen || []).includes(id)) return null;
  return Object.assign({}, ch, { id, f, text: typeof ch.text === 'function' ? ch.text(run) : ch.text, story: true });
}

// grants every newly earned achievement, returns them
function grantAchievements(run, meta) {
  meta.ach = meta.ach || {}; const got = [];
  for (const a of ACHIEVEMENTS) { if (meta.ach[a.id]) continue; let ok = false; try { ok = a.test(run); } catch (e) { ok = false; }
    if (ok) { meta.ach[a.id] = Date.now(); meta.diamonds += a.dia; got.push(a); } }
  return got;
}

function fmtDmg(n) { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e5 ? Math.round(n / 1000) + 'K' : String(n); }
function stepFX(dt) {
  FXS.clock += dt; if (FXS.slowmo > 0) FXS.slowmo -= dt;
  if (typeof stepSpellFX === 'function') stepSpellFX(dt);
  for (const a of ['dmgs', 'cutins', 'shocks', 'combos']) { for (const o of FXS[a]) o.t += dt; FXS[a] = FXS[a].filter(o => o.t < o.life); }
  for (const d of FXS.drops) { d.t += dt; if (d.t < 0.7) { d.vy += 220 * dt; d.x += d.vx * dt; d.y += d.vy * dt; if (d.y > d.ground) { d.y = d.ground; d.vy *= -0.5; d.vx *= 0.6; } } else if (!d.flown) { d.flown = true; UI.flyItem && UI.flyItem(d); } }
  FXS.drops = FXS.drops.filter(d => !d.flown);
  for (const p of FXS.parts) { p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  FXS.parts = FXS.parts.filter(p => p.t < p.life);
  for (const a of ['texts', 'rings', 'beams', 'bolts', 'slashes', 'ghosts', 'gusts', 'petals']) { for (const o of FXS[a]) { o.t += dt; if (o.vy && a === 'texts') o.y += o.vy * dt * (1 - o.t / o.life); if (a === 'gusts') o.x += o.vx * dt; if (a === 'petals') { o.x += o.vx * dt; o.y += o.vy * dt; o.spin += dt * 4; } } FXS[a] = FXS[a].filter(o => o.t < o.life); }
  for (const c of FXS.coins) { c.t += dt; if (c.t < 0.5) { c.vy += 260 * dt; c.x += c.vx * dt; c.y += c.vy * dt; if (c.y > c.ground) { c.y = c.ground; c.vy *= -0.45; c.vx *= 0.6; } } else if (!c.flown) { c.flown = true; UI.flyCoin(c); } }
  FXS.coins = FXS.coins.filter(c => !c.flown);
  FXS.shake = Math.max(0, FXS.shake - dt * 30);
  if (FXS.flash) { FXS.flash.t += dt; if (FXS.flash.t > 0.25) FXS.flash = null; }
}

const SFX = {
  ctx: null, on: true, last: {}, master: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = 0.32; this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 0.5; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; } catch (e) { this.ctx = null; } },
  tone(f, dur, type = 'square', vol = 0.3, slide = 0, delay = 0) { const c = this.ctx, t = c.currentTime + delay; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02); },
  hiss(dur, vol = 0.3, freq = 1200, delay = 0, q = 0.8) { const c = this.ctx, t = c.currentTime + delay; const s = c.createBufferSource(); s.buffer = this.noise; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02); },
  play(n) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const now = performance.now(); if (this.last[n] && now - this.last[n] < (n === 'coin' ? 35 : 55)) return; this.last[n] = now;
    const T = this.tone.bind(this), N = this.hiss.bind(this);
    switch (n) {
      case 'hit': N(0.06, 0.18, 2200); T(180, 0.05, 'square', 0.06, 0.6); break;
      case 'ehit': N(0.05, 0.12, 900); break;
      case 'bow': T(900, 0.05, 'triangle', 0.08, 0.5); break;
      case 'pew': T(700, 0.08, 'square', 0.05, 0.4); break;
      case 'twang': T(300, 0.12, 'sawtooth', 0.07, 0.5); break;

      case 'boom': N(0.4, 0.4, 300, 0, 0.6); T(90, 0.3, 'sine', 0.3, 0.4); break;
      case 'anvil': N(0.08, 0.3, 3200, 0, 2); T(1480, 0.35, 'triangle', 0.09, 1); T(2220, 0.25, 'sine', 0.05, 1); T(110, 0.12, 'square', 0.08, 0.5); break;
      case 'forged': [523, 659, 784, 1047].forEach((f, i) => T(f, 0.18, 'square', 0.06, 1, i * 0.07)); T(1568, 0.5, 'triangle', 0.05, 1, 0.3); break;
      case 'hammer': N(0.6, 0.5, 200, 0, 0.5); T(70, 0.5, 'sine', 0.5, 0.4); T(140, 0.2, 'square', 0.12, 0.5); break;
      case 'whoosh': N(0.5, 0.15, 600, 0, 0.4); break;

// ===== Spell visuals that grow with the caster's signature power =====
// pw is sigPower(u): about 1 for a fresh signature, up to 3 for a maxed, item-stacked caster.
// Ground marks (scorch, stuck arrows) draw on the low-res pass under units; fire and arrows draw on the hi-res pass.
FXS.spells = []; FXS.decals = [];
const FIRE_COLS = ['#ffffff', '#fff3a0', '#ffd23a', '#ff8a2a', '#ff3d2d', '#8a1a2a'];

Object.assign(FX, {
  // the fireball lands: a blooming sphere of flame, rising embers and smoke, a scorch mark that lingers
  fireburst(x, y, r, pw = 1) {
    const big = 0.8 + 0.35 * pw;
    FXS.spells.push({ kind: 'fire', x, y, r: r * big, pw, t: 0, life: 0.55 + 0.15 * pw });
    if (pw > 1.6) FXS.spells.push({ kind: 'pillar', x, y, r: r * 0.5 * big, pw, t: 0, life: 0.7 });
    for (let i = 0; i < Math.round(8 + 6 * pw); i++) FXS.spells.push({ kind: 'smoke', x: x + rand(-r, r) * 0.6, y: y - rand(0, 10), vx: rand(-8, 8), vy: -rand(14, 30), s: rand(4, 7) * big, t: -rand(0, 0.25), life: rand(0.9, 1.5) });
    FX.particles(x, y - 6, Math.round(20 + 22 * pw), ['#ffd23a', '#ff8a2a', '#ff3d2d', '#fff3a0'], { spread: r * 1.1 * big, up: true, grav: 60 });
    FXS.decals.push({ kind: 'scorch', x, y, r: r * 0.8 * big, t: 0, life: 3 + pw });
    FX.shockwave(x, y, r * 2 * big, '#ff8a3a'); if (pw > 1.3) FX.shockwave(x, y, r * 2.8 * big, '#ffd23a');
    FX.shake(4 + 3 * pw); FX.flash('#ff8a3a', Math.min(0.35, 0.1 + 0.08 * pw));
  },
  // the final wave: a dust storm rolls in from the right edge and war drums thump
  surge(n) { for (let i = 0; i < 40 + Math.min(80, n); i++) FXS.parts.push({ x: W + rand(-6, 10), y: rand(GRID.y - 10, GRID.y + GRID.rows * GRID.cell + 10), vx: -rand(40, 110), vy: rand(-8, 4), life: rand(0.8, 1.6), t: 0, color: pick(['#c9b48a', '#a8916a', '#8a7a5a']), size: 2, grav: 0 });
    FX.flash('#ff3d6e', 0.15); },
  // one tick of arrow rain: real arrows dive in from the sky at an angle and stick in the ground
  arrowStorm(x, y, r, pw = 1) {
    const n = Math.round(5 + 4 * pw);
    for (let i = 0; i < n; i++) { const tx = x + rand(-r, r), ty = y + rand(-r, r) * 0.55, d = rand(0.16, 0.3);
      FXS.spells.push({ kind: 'arrow', sx: tx - 46, sy: ty - 150, x: tx, y: ty, t: -rand(0, 0.12), life: d, gold: pw > 2 && Math.random() < 0.3 }); }
  },
});

function stepSpellFX(dt) {
  stepSigVFX(dt); stepCastleVFX(dt);
  for (const s of FXS.spells) { s.t += dt;
    if (s.kind === 'smoke' && s.t > 0) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy *= 0.97; s.s *= 1 + 0.6 * dt; }
    if (s.kind === 'arrow' && s.t >= s.life && !s.landed) { s.landed = true;
      FXS.decals.push({ kind: 'arrow', x: s.x, y: s.y, t: 0, life: 1.4, gold: s.gold }); FX.particles(s.x, s.y, 3, ['#c9b48a', '#8a6a4a'], { spread: 6 }); } }
  FXS.spells = FXS.spells.filter(s => s.t < s.life || (s.kind === 'arrow' && !s.landed));
  if (FXS.spells.length > 600) FXS.spells.splice(0, FXS.spells.length - 600);
  for (const d of FXS.decals) d.t += dt;
  FXS.decals = FXS.decals.filter(d => d.t < d.life);
  if (FXS.decals.length > 160) FXS.decals.splice(0, FXS.decals.length - 160);
}

// low-res, under units
function drawSpellDecals(g) {
  for (const d of FXS.decals) { const a = 1 - d.t / d.life;
    if (d.kind === 'scorch') { g.globalAlpha = 0.45 * a; g.fillStyle = '#2a1a1a'; g.beginPath(); g.ellipse(Math.round(d.x), Math.round(d.y), d.r, d.r * 0.45, 0, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 0.6 * a * (d.t < 0.8 ? 1 : 0.4); g.fillStyle = '#ff8a2a'; for (let i = 0; i < 6; i++) g.fillRect(Math.round(d.x + Math.cos(i * 2.1) * d.r * 0.6), Math.round(d.y + Math.sin(i * 2.1) * d.r * 0.25), 1, 1); }
    else if (d.kind === 'mark') { g.globalAlpha = 0.35 * a; g.fillStyle = d.col; g.beginPath(); g.ellipse(Math.round(d.x), Math.round(d.y), d.r, d.r * 0.4, 0, 0, Math.PI * 2); g.fill(); }
    else if (d.kind === 'arrow') { g.globalAlpha = Math.min(1, a * 2); const x = Math.round(d.x), y = Math.round(d.y);
      g.fillStyle = '#5a3a1a'; g.fillRect(x - 2, y - 5, 1, 2); g.fillRect(x - 1, y - 3, 1, 3); g.fillStyle = d.gold ? '#ffd84a' : '#f1ecdc'; g.fillRect(x - 3, y - 6, 2, 1); }
  }
  g.globalAlpha = 1;
}

// hi-res, over the scene
function drawSpellFX(ctx, k, ox, oy, B) {
  const X = x => x * k + ox, Y = y => y * k + oy;
  // arrow rain zones cast a shadow of incoming arrows
  if (B) for (const z of B.zones) if (z.type === 'arrows') { ctx.globalAlpha = 0.22; ctx.fillStyle = '#0f1430'; ctx.beginPath(); ctx.ellipse(X(z.x), Y(z.y), z.r * k, z.r * 0.55 * k, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // fireballs in flight: a glowing core with a flame tail that grows with power
  if (B) for (const p of B.projs) if (p.type === 'fireBig') { const pw = (p.o && p.o.pw) || 1, x = X(p.x), y = Y(p.y), rr = (4 + 2.5 * pw) * k * (0.5 + 0.7 * (p.k || 0));
    const vx = p.tx - p.sx, vy = p.ty - p.sy, L = Math.hypot(vx, vy) || 1, ux = -vx / L, uy = -vy / L;
    for (let i = 6; i >= 1; i--) { const f = i / 6, wob = Math.sin(FXS.clock * 40 + i) * 1.5 * k; ctx.globalAlpha = 0.5 * (1 - f) + 0.15; ctx.fillStyle = FIRE_COLS[Math.min(5, 2 + Math.floor(f * 4))];
      ctx.beginPath(); ctx.arc(x + ux * rr * 1.6 * f * 2 + wob * uy, y + uy * rr * 1.6 * f * 2 - wob * ux, rr * (1 - f * 0.6), 0, Math.PI * 2); ctx.fill(); }
    const gr = ctx.createRadialGradient(x, y, 0, x, y, rr * 2.2); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, '#fff3a0'); gr.addColorStop(0.5, '#ffb23a'); gr.addColorStop(0.75, 'rgba(255,90,40,0.5)'); gr.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, rr * 2.2, 0, Math.PI * 2); ctx.fill();
    if (Math.random() < 0.6 + 0.2 * pw) FXS.parts.push({ x: p.x + rand(-2, 2), y: p.y + rand(-2, 2), vx: rand(-15, 15), vy: rand(-25, 5), life: rand(0.2, 0.45), t: 0, color: pick(['#ffd23a', '#ff8a2a', '#ff3d2d']), size: 1, grav: -20 }); }
  for (const s of FXS.spells) { if (s.t < 0) continue; const kk = Math.min(1, s.t / s.life);
    if (s.kind === 'fire') { const grow = Math.min(1, s.t / 0.12), rr = s.r * k * (0.35 + 0.65 * grow) * (1 + 0.15 * kk), x = X(s.x), y = Y(s.y) - rr * 0.35;
      const gr = ctx.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, kk < 0.3 ? '#ffffff' : '#fff3a0'); gr.addColorStop(0.3, '#ffd23a'); gr.addColorStop(0.6, '#ff8a2a'); gr.addColorStop(0.85, 'rgba(255,61,45,0.6)'); gr.addColorStop(1, 'rgba(138,26,42,0)');
      ctx.globalAlpha = 1 - kk * kk; ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y, rr, rr * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      // flame tongues licking upward
      ctx.fillStyle = '#ffb23a'; for (let i = 0; i < 7 + 3 * s.pw; i++) { const a = i * 2.39, d = rr * 0.7, fx = x + Math.cos(a) * d, fy = y + Math.sin(a) * d * 0.5, h = rr * (0.5 + 0.3 * Math.sin(FXS.clock * 25 + i)) * (1 - kk);
        ctx.beginPath(); ctx.moveTo(fx - 3 * k, fy); ctx.quadraticCurveTo(fx, fy - h * 1.2, fx + 3 * k, fy); ctx.fill(); } }
    else if (s.kind === 'pillar') { const x = X(s.x), y = Y(s.y), w = s.r * k * (1 - kk * 0.5), h = 120 * k * Math.min(1, s.t / 0.15) * (1 - kk * 0.3);
      const gr = ctx.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, 'rgba(255,61,45,0)'); gr.addColorStop(0.4, 'rgba(255,138,42,0.7)'); gr.addColorStop(1, 'rgba(255,243,160,0.95)');
      ctx.globalAlpha = 1 - kk; ctx.fillStyle = gr; ctx.fillRect(x - w / 2, y - h, w, h); }
    else if (s.kind === 'smoke') { ctx.globalAlpha = 0.35 * (1 - kk); ctx.fillStyle = kk < 0.2 ? '#5a3a3a' : '#4a4a5e'; ctx.beginPath(); ctx.arc(X(s.x), Y(s.y), s.s * k, 0, Math.PI * 2); ctx.fill(); }
    else if (s.kind === 'arrow' && !s.landed) { const f = Math.max(0, s.t / s.life), x = X(s.sx + (s.x - s.sx) * f), y = Y(s.sy + (s.y - s.sy) * f), dx = (s.x - s.sx), dy = (s.y - s.sy), L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, len = 11 * k;
      ctx.globalAlpha = 0.35; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = k; ctx.beginPath(); ctx.moveTo(x - ux * len * 2.6, y - uy * len * 2.6); ctx.lineTo(x - ux * len, y - uy * len); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 1.4 * k; ctx.beginPath(); ctx.moveTo(x - ux * len, y - uy * len); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = s.gold ? '#ffd84a' : '#e8eefc'; ctx.beginPath(); ctx.moveTo(x + ux * 3 * k, y + uy * 3 * k); ctx.lineTo(x - uy * 2 * k, y + ux * 2 * k); ctx.lineTo(x + uy * 2 * k, y - ux * 2 * k); ctx.fill();
      ctx.fillStyle = '#ff5d8f'; ctx.fillRect(x - ux * len - 1.5 * k, y - uy * len - 1.5 * k, 3 * k, 3 * k); }
  }
  ctx.globalAlpha = 1;
  drawSigVFX(ctx, k, ox, oy, B);
  drawCastleVFX(ctx, k, ox, oy, B);
}

// ===== Signature projectiles: each hero throws something of its own that swells in flight and bursts on impact =====
// A projectile with o.vfx = { shape, col, col2, pw } is drawn here on the hi-res pass instead of as a pixel dot.
Object.assign(FX, {
  // a big impact: white-hot core, colored bloom, flying shards, dust and a lingering ground mark
  blast(x, y, r, cols, pw = 1, o = {}) {
    const big = 0.75 + 0.25 * pw;
    FXS.spells.push({ kind: 'blast', x, y, r: r * big, cols, pw, t: 0, life: 0.45 + 0.12 * pw });
    const ns = Math.round((o.shards == null ? 8 : o.shards) + 4 * pw);
    for (let i = 0; i < ns; i++) { const a = rand(Math.PI * 1.05, Math.PI * 1.95), sp = rand(60, 140) * big;
      FXS.spells.push({ kind: 'shard', x, y: y - 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.9, rot: rand(0, 6), vr: rand(-14, 14), s: rand(1.5, 3) * big, col: pick(cols.slice(1)), t: 0, life: rand(0.45, 0.8) }); }
    FX.particles(x, y - 4, Math.round(14 + 12 * pw), cols, { spread: r * big, up: true, grav: 80 });
    FXS.decals.push({ kind: 'mark', x, y, r: r * 0.7 * big, col: cols[cols.length - 1], t: 0, life: 2 + pw });
    FX.shockwave(x, y, r * 1.8 * big, cols[2] || cols[1]);
    FX.shake(2 + 2.5 * pw);
  },
  // a projectile's own small burst when it lands without a custom impact
  vfxLand(p) { const v = p.o.vfx, c = [v.col2 || '#ffffff', v.col]; FX.particles(p.tx, p.ty, Math.round(8 + 4 * (v.pw || 1)), c, { spread: 12, up: true, grav: 40 });
    FXS.spells.push({ kind: 'pop', x: p.tx, y: p.ty, col: v.col, r: 6 + 3 * (v.pw || 1), t: 0, life: 0.3 }); },
  // a purely visual flight from a to b (notes, seeds, souls) that pops on arrival
  fly(sx, sy, tx, ty, shape, col, col2, pw = 1, dur = 0.45, delay = 0) { FXS.spells.push({ kind: 'fly', sx, sy, x: sx, y: sy, tx, ty, shape, col, col2, pw, t: -delay, life: dur, arc: shape === 'hawk' ? 4 : Math.hypot(tx - sx, ty - sy) * 0.25 }); },
  // a small spark at the caster's hands: the wind-up, nothing that hides the hero
  castSpark(u, col) { const hx = u.x + (u.facing || 1) * 6, hy = u.y - 12 - (u.z || 0); FX.particles(hx, hy, 8, [col, '#ffffff'], { spread: 6, up: true, grav: -30 }); },
  // a beam of light dropping onto one spot
  skyRay(x, y, col, delay = 0) { FXS.spells.push({ kind: 'ray', x, y, col, t: -delay, life: 0.55 }); },
  // bone spikes bursting out of the ground
  spikes(x, y, col, delay = 0) { FXS.spells.push({ kind: 'spike', x, y, col, h: rand(10, 16), t: -delay, life: 0.9 }); },
  // a cone of roaring sound arcs rolling forward
  roar(x, y, col, pw = 1) { for (let i = 0; i < 3 + Math.round(pw); i++) FXS.spells.push({ kind: 'arc', x, y, col, t: -i * 0.09, life: 0.55, pw }); },
  // arrows loosed straight up before they rain down
  launch(x, y, n) { for (let i = 0; i < n; i++) FXS.spells.push({ kind: 'up', x: x + rand(-3, 3), y, vx: rand(10, 40), t: -i * 0.03, life: 0.35 }); },
  // three raking claw marks
  claws(x, y, col) { FXS.spells.push({ kind: 'claw', x, y, col, t: 0, life: 0.35 }); },
});

function stepSigVFX(dt) {
  for (const s of FXS.spells) { if (s.kind === 'shard' && s.t > 0) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.rot += s.vr * dt; }
    if (s.kind === 'fly' && s.t >= 0) { const f = Math.min(1, s.t / s.life); s.x = s.sx + (s.tx - s.sx) * f; s.y = s.sy + (s.ty - s.sy) * f - Math.sin(f * Math.PI) * s.arc;
      if (s.t + dt >= s.life && !s.done) { s.done = true; FXS.spells.push({ kind: 'pop', x: s.tx, y: s.ty, col: s.col, r: 7, t: 0, life: 0.3 }); FX.particles(s.tx, s.ty, 6, [s.col, s.col2 || '#ffffff'], { spread: 8, up: true }); } }
    if (s.kind === 'up' && s.t > 0) { s.x += s.vx * dt; } }
}

// one shape, drawn at hi-res around (x,y); r is its size in screen pixels, a is the heading
function drawVfxShape(ctx, shape, x, y, r, a, col, col2, k) {
  const glow = (rr, c) => { const gr = ctx.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.3, col2 || '#ffffff'); gr.addColorStop(0.6, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill(); };
  ctx.save(); ctx.lineJoin = 'round';
  switch (shape) {
    case 'disc': { ctx.globalAlpha = 0.6; glow(r * 2, col); ctx.globalAlpha = 1; ctx.translate(x, y); ctx.scale(Math.abs(Math.cos(FXS.clock * 18)) * 0.7 + 0.3, 1);
      ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col2; ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.fill(); break; }

function teamCounts(run) { const c = {}, r = {}; for (const h of run.roster) { const d = HERO_BY_ID[h.id]; c[d.cls] = (c[d.cls] || 0) + 1; r[d.race] = (r[d.race] || 0) + 1; } return { c, r }; }

// how a card fits: which bonuses it would switch on or move closer
function draftFit(run, o) {
  const d = HERO_BY_ID[o.id], { c, r } = teamCounts(run), out = [];
  for (const [kind, key, T, n0] of [['cls', d.cls, CLASSES[d.cls], c[d.cls] || 0], ['race', d.race, RACES[d.race], r[d.race] || 0]]) {
    const n = n0 + 1, lvl = T.at.indexOf(n), label = kind === 'cls' ? `${T.icon} ${T.name}` : T.name;
    if (lvl >= 0) out.push({ score: 3 + lvl, html: `<div class="fit up" data-tip="syn:${key}"><b>Unlocks ${esc(label)}</b>${pips(n, T.at)}<small>${esc(T.desc(lvl))}</small></div>` });
    else if (n < T.at[0]) out.push({ score: n0 ? 1 : 0, html: `<div class="fit" data-tip="syn:${key}"><b>${esc(label)} ${n}/${T.at[0]}</b>${pips(n, T.at)}<small>${n0 ? 'You have one. ' : ''}${T.at[0] - n} more for the bonus.</small></div>` });
    else out.push({ score: 0, html: `<div class="fit dim"><b>${esc(label)} full</b>${pips(Math.min(n, T.at[T.at.length - 1]), T.at)}</div>` });
  }
  if (o.temper) { const mate = run.roster.find(h => heroTemper(h) === o.temper), T = TEMPERS[o.temper];
    if (mate && T.pdesc) out.push({ score: 2, html: `<div class="fit up tmpfit" data-tip="tmp:${o.temper}"><b>${T.icon} Pairs with ${esc(HERO_BY_ID[mate.id].name.split(' ')[0])}</b><small>${esc(T.pdesc)}</small></div>` }); }
  return { score: out.reduce((a, f) => a + f.score, 0), html: out.map(f => f.html).join('') };
}

function towerTopWorld() { return TOWER.N ? floorTopY(TOWER.N - 1) - BASE_H : -BASE_H; }

function drawTowerFloor(g, i, wy) {
  const cx = TW / 2, w = 64 - Math.min(16, Math.floor(i / 10) * 2), x = Math.round(cx - w / 2), y = Math.round(wy);
  const boss = isBossFloor(i), stone = boss ? '#e8dcb0' : i % 2 ? '#d4cff0' : '#cbc5ea', mortar = boss ? '#c9a35a' : '#aea7d8';
  g.fillStyle = OUTLINE; g.fillRect(x - 1, y, w + 2, FLOOR_H);
  g.fillStyle = stone; g.fillRect(x, y, w, FLOOR_H - 1);
  g.fillStyle = mortar; for (let yy = y + 4; yy < y + FLOOR_H; yy += 5) { g.fillRect(x, yy, w, 1); for (let xx = x + ((yy / 5) % 2 ? 4 : 0); xx < x + w; xx += 9) g.fillRect(xx, yy - 4, 1, 4); }

  g.fillStyle = '#d4cff0'; g.fillRect(cx - 46, by, 92, BASE_H);
  g.fillStyle = '#aea7d8'; for (let yy = by + 5; yy < by + BASE_H; yy += 5) { g.fillRect(cx - 46, yy, 92, 1); for (let xx = cx - 46 + ((yy / 5) % 2 ? 4 : 0); xx < cx + 46; xx += 9) g.fillRect(xx, yy - 4, 1, 4); }
  g.fillStyle = OUTLINE; g.fillRect(cx - 9, by + BASE_H - 26, 18, 26); g.fillStyle = '#3a2a4a'; g.fillRect(cx - 8, by + BASE_H - 25, 16, 25);
  g.fillStyle = '#ff5d8f'; g.fillRect(cx - 38, by + 10, 10, 18); g.fillRect(cx + 28, by + 10, 10, 18); g.fillStyle = '#ffd84a'; g.fillRect(cx - 35, by + 15, 4, 4); g.fillRect(cx + 31, by + 15, 4, 4);
